[project]
name = "tipitaka-qa"
version = "0.1.0"
description = "Thai Tipitaka QA with a Neo4j knowledge graph and a citation-verified agent harness"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "huggingface_hub>=0.24",
    "neo4j>=5.20",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-neo4j>=0.1",
    "langgraph>=0.2",
    "torch>=2.6",
    "sentence-transformers>=3.0",
    "gradio>=6.32.0",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

# CUDA build of PyTorch (GTX 1650 Ti, sm_75). CPU-only machines can drop this source.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tipitaka_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
