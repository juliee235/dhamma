services:
  neo4j:
    image: neo4j:5.26-community
    container_name: tipitaka-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # browser
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tipitaka-dev-pw}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
